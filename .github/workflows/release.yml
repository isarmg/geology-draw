name: Release Linux x86_64

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Run tests
        env:
          MPLCONFIGDIR: /tmp/strat-matplotlib-tests
        run: python -m unittest discover -v

      - name: Build standalone executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name geology-draw-linux-x86_64 \
            --add-data "web:web" \
            --add-data "examples:examples" \
            app.py

      - name: Verify executable
        env:
          MPLCONFIGDIR: /tmp/strat-matplotlib-smoke
        run: |
          file dist/geology-draw-linux-x86_64 | grep -F "x86-64"
          dist/geology-draw-linux-x86_64 --help >/dev/null

          dist/geology-draw-linux-x86_64 serve \
            --host 127.0.0.1 --port 8765 >/tmp/geology-draw.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/v1/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/geology-draw.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/geology-draw.log
          exit 1

      - name: Package release assets
        run: |
          mkdir -p release/geology-draw-linux-x86_64
          cp dist/geology-draw-linux-x86_64 README.md \
            release/geology-draw-linux-x86_64/
          tar -C release -czf release/geology-draw-linux-x86_64.tar.gz \
            geology-draw-linux-x86_64
          cd release
          sha256sum geology-draw-linux-x86_64.tar.gz \
            > geology-draw-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            release/geology-draw-linux-x86_64.tar.gz
            release/geology-draw-linux-x86_64.tar.gz.sha256
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
